; PHP de la imagen de producción (Dockerfile de la raíz). El de desarrollo es docker/php.ini.
[PHP]
memory_limit = 512M
max_execution_time = 60
post_max_size = 256M
upload_max_filesize = 256M
expose_php = Off
; Nunca mostrar errores al visitante: van al log (stderr de Apache) y a storage/logs
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

[Date]
date.timezone = Asia/Tokyo

[mbstring]
mbstring.language = Japanese

[Session]
session.cookie_httponly = 1

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
; El código no cambia dentro de la imagen: no revisar los archivos en cada petición (cada despliegue es un contenedor nuevo)
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
realpath_cache_size = 16M
realpath_cache_ttl = 600
