# Apache de la imagen de producción (Dockerfile de la raíz, mod_php en un solo contenedor).
# El de desarrollo es docker/000-default.conf (Apache aparte + PHP-FPM).
# Sin esto Apache avisa en cada arranque (AH00558); el dominio real lo da la cabecera Host
ServerName localhost

<VirtualHost *:80>
	ServerAdmin webmaster@localhost

	# Laravel: solo public/ es accesible desde la web
	DocumentRoot /var/www/public

	<Directory /var/www/public>
		Options -Indexes +FollowSymLinks
		# public/.htaccess: reescritura a index.php y estáticos del legacy desde public/legacy/ (NUCLEO.md §8).
		# Debian deja AllowOverride None en /var/www/: sin esto, toda URL salvo / daría 404
		AllowOverride All
		Require all granted
	</Directory>

	# Igual que post_max_size / upload_max_filesize de docker/produccion/php.ini (256 MB)
	LimitRequestBody 268435456

	DirectoryIndex index.php index.html

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
