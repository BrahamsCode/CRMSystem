services:
  app:
    build: .
    ports:
      # Puertos del host configurables en docker/.env, para poder levantar
      # este proyecto junto a otro con la misma configuración
      - ${APP_PORT:-8081}:80
    volumes:
      - ../public_html:/var/www
      - vendor:/var/www/vendor
      - ./php.ini:/usr/local/etc/php/conf.d/zz-app.ini
      - ./apache.conf:/etc/apache2/sites-available/000-default.conf:ro
    environment:
      TZ: Asia/Tokyo
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    command: postgres -c timezone=Asia/Tokyo -c log_timezone=Asia/Tokyo
    ports:
      - ${DB_FORWARD_PORT:-15434}:5432
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Crea también la base de los tests al inicializar un volumen nuevo
      - ./initdb:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - ${MAILPIT_PORT:-8026}:8025
    environment:
      TZ: JST-9

  # Solo cuando se necesite: docker compose run --rm node npm install / npm run build
  node:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../public_html:/app
    ports:
      - ${VITE_PORT:-5174}:5173
    environment:
      TZ: JST-9
      # El navegador se conecta a Vite por el puerto del host, no por el del contenedor
      VITE_PORT: ${VITE_PORT:-5174}
    profiles: ["node"]

volumes:
  dbdata:
  vendor:
