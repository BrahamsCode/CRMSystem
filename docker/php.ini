; Override mínimo (se monta en conf.d, el resto usa los valores por defecto de PHP)
[PHP]
memory_limit = 512M
max_execution_time = 60
post_max_size = 256M
upload_max_filesize = 256M
expose_php = Off
display_errors = On
error_reporting = E_ALL

[Date]
date.timezone = Asia/Tokyo

[mbstring]
mbstring.language = Japanese

[opcache]
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
