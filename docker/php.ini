; Override mínimo (se monta en conf.d, el resto usa los valores por defecto de PHP)
[PHP]
memory_limit = 512M
max_execution_time = 60
post_max_size = 256M
upload_max_filesize = 256M
expose_php = Off
display_errors = On
error_reporting = E_ALL

[Date]
date.timezone = Asia/Tokyo

[mbstring]
mbstring.language = Japanese

[opcache]
opcache.enable = 1
opcache.validate_timestamps = 1
; El código vive en una carpeta de Windows montada en Docker (cada stat es lento):
; revisar cambios cada 2 s en vez de en cada petición. Un cambio de código tarda como mucho 2 s en verse
opcache.revalidate_freq = 2
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
realpath_cache_size = 16M
realpath_cache_ttl = 600
